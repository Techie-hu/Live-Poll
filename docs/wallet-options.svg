<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d">
  <title id="t">Live Poll — Supported Wallet Options</title>
  <desc id="d">Stylized representation of the wallet picker surfaced by @creit.tech/stellar-wallets-kit after the user clicks Connect Wallet. Shows all nine supported wallets: Freighter, xBull, Albedo, Lobstr, Rabet, Hana, Klever, OneKey, Bitget.</desc>

  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#581c87"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="modalBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="testnetPill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3730a3"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="halo1" cx="0.18" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="0.86" cy="0.92" r="0.9">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background gradient + ambient halos -->
  <rect width="1200" height="720" fill="url(#pageBg)"/>
  <rect width="1200" height="720" fill="url(#halo1)"/>
  <rect width="1200" height="720" fill="url(#halo2)"/>

  <!-- Decorative specks -->
  <g fill="#ffffff" opacity="0.22">
    <circle cx="120" cy="170" r="1.4"/>
    <circle cx="180" cy="120" r="1.0"/>
    <circle cx="980" cy="140" r="1.2"/>
    <circle cx="1050" cy="200" r="1.4"/>
    <circle cx="60" cy="520" r="1.2"/>
    <circle cx="1100" cy="540" r="1.4"/>
    <circle cx="220" cy="660" r="1.0"/>
    <circle cx="1080" cy="660" r="1.2"/>
    <circle cx="380" cy="155" r="0.9"/>
    <circle cx="690" cy="110" r="1.1"/>
  </g>

  <!-- Faded live-app header (visible behind modal) -->
  <g opacity="0.55">
    <rect x="40" y="120" width="1120" height="60" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="64" y="158" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Live Poll</text>
    <text x="64" y="174" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#c4b5fd">Stellar testnet • One question, real-time results</text>
    <rect x="1014" y="136" width="124" height="32" rx="9" fill="url(#ctaGrad)"/>
    <text x="1076" y="158" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Connect Wallet</text>
  </g>

  <!-- Wallet picker modal -->
  <g filter="url(#cardShadow)">
    <rect x="160" y="200" width="880" height="450" rx="22" fill="url(#modalBg)" stroke="#312e81" stroke-width="1"/>
    <rect x="160" y="200" width="880" height="450" rx="22" fill="none" stroke="#a78bfa" stroke-opacity="0.18" stroke-width="1.5"/>
  </g>

  <!-- Modal header -->
  <text x="190" y="252" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Connect a Wallet</text>
  <text x="190" y="278" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#c4b5fd">9 wallets supported via <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e0e7ff">@creit.tech/stellar-wallets-kit</tspan></text>

  <!-- TESTNET pill -->
  <rect x="932" y="232" width="80" height="24" rx="12" fill="url(#testnetPill)"/>
  <text x="972" y="249" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" text-anchor="middle" letter-spacing="2">TESTNET</text>

  <!-- Row 1 -->
  <!-- Freighter -->
  <g>
    <rect x="190" y="300" width="260" height="88" rx="14" fill="url(#cardBg)" stroke="#d946ef" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="226" cy="344" r="22" fill="#d946ef"/>
    <text x="226" y="351" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">F</text>
    <text x="262" y="338" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Freighter</text>
    <text x="262" y="358" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#c4b5fd">Browser extension</text>
  </g>
  <!-- xBull -->
  <g>
    <rect x="470" y="300" width="260" height="88" rx="14" fill="url(#cardBg)" stroke="#3b82f6" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="506" cy="344" r="22" fill="#3b82f6"/>
    <text x="506" y="351" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">X</text>
    <text x="542" y="338" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">xBull</text>
    <text x="542" y="358" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#c4b5fd">Browser extension</text>
  </g>
  <!-- Albedo -->
  <g>
    <rect x="750" y="300" width="260" height="88" rx="14" fill="url(#cardBg)" stroke="#f97316" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="786" cy="344" r="22" fill="#f97316"/>
    <text x="786" y="351" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">A</text>
    <text x="822" y="338" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Albedo</text>
    <text x="822" y="358" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#c4b5fd">Web wallet</text>
  </g>

  <!-- Row 2 -->
  <!-- Lobstr -->
  <g>
    <rect x="190" y="408" width="260" height="88" rx="14" fill="url(#cardBg)" stroke="#ef4444" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="226" cy="452" r="22" fill="#ef4444"/>
    <text x="226" y="459" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">L</text>
    <text x="262" y="446" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Lobstr</text>
    <text x="262" y="466" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#c4b5fd">Mobile &amp; web</text>
  </g>
  <!-- Rabet -->
  <g>
    <rect x="470" y="408" width="260" height="88" rx="14" fill="url(#cardBg)" stroke="#a855f7" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="506" cy="452" r="22" fill="#a855f7"/>
    <text x="506" y="459" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">R</text>
    <text x="542" y="446" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Rabet</text>
    <text x="542" y="466" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#c4b5fd">Browser extension</text>
  </g>
  <!-- Hana -->
  <g>
    <rect x="750" y="408" width="260" height="88" rx="14" fill="url(#cardBg)" stroke="#0ea5e9" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="786" cy="452" r="22" fill="#0ea5e9"/>
    <text x="786" y="459" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">H</text>
    <text x="822" y="446" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Hana</text>
    <text x="822" y="466" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#c4b5fd">Browser extension</text>
  </g>

  <!-- Row 3 -->
  <!-- Klever -->
  <g>
    <rect x="190" y="516" width="260" height="88" rx="14" fill="url(#cardBg)" stroke="#22c55e" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="226" cy="560" r="22" fill="#22c55e"/>
    <text x="226" y="567" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">K</text>
    <text x="262" y="554" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Klever</text>
    <text x="262" y="574" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#c4b5fd">Browser extension</text>
  </g>
  <!-- OneKey -->
  <g>
    <rect x="470" y="516" width="260" height="88" rx="14" fill="url(#cardBg)" stroke="#71717a" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="506" cy="560" r="22" fill="#27272a"/>
    <circle cx="506" cy="560" r="22" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <text x="506" y="567" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    <text x="542" y="554" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">OneKey</text>
    <text x="542" y="574" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#c4b5fd">Browser extension</text>
  </g>
  <!-- Bitget -->
  <g>
    <rect x="750" y="516" width="260" height="88" rx="14" fill="url(#cardBg)" stroke="#06b6d4" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="786" cy="560" r="22" fill="#06b6d4"/>
    <text x="786" y="567" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">B</text>
    <text x="822" y="554" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Bitget</text>
    <text x="822" y="574" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#c4b5fd">Browser extension</text>
  </g>

  <!-- Footer disclaimer -->
  <text x="190" y="630" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a5b4fc">Wallets above are registered in <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e0e7ff">web/src/lib/wallet-kit.ts</tspan>; only those installed in the user's browser are reported as available at runtime.</text>
</svg>
